<script>
(()=>{
const OWNER_KEY='gather-owner-token-v2', PROFILE_KEY='gather-profile-v2';
let ownerToken=localStorage.getItem(OWNER_KEY);if(!ownerToken){ownerToken=crypto.randomUUID();localStorage.setItem(OWNER_KEY,ownerToken)}
let preparedPicture=null,pictureProcessing=null;
let profile=readProfile(),events=[],view='dashboard',activeId=null,filter='all',formMode='create',seats=1,savingEvent=false;
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let label=b.textContent.replace(/\s+/g,' ').trim();if(label==='＋ New poll'||label==='＋ Create a poll'){e.preventDefault();e.stopImmediatePropagation();createEvent()}},true);
function readProfile(){try{return JSON.parse(localStorage.getItem(PROFILE_KEY))||null}catch{return null}}
function saveProfileData(p){profile=p;localStorage.setItem(PROFILE_KEY,JSON.stringify(p))}
function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(name=''){return String(name).trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()||'?' }
function current(){return events.find(e=>e.id===activeId)}
function fmtDate(v){if(!v)return 'Date to be announced';const d=new Date(v+'T12:00:00');return new Intl.DateTimeFormat('en',{weekday:'short',month:'short',day:'numeric',year:'numeric'}).format(d)}
function month(v){if(!v)return 'TBD';return new Intl.DateTimeFormat('en',{month:'short'}).format(new Date(v+'T12:00:00'))}
function day(v){return v?new Date(v+'T12:00:00').getDate():'—'}
function wallTimeToUTC(date,time,tz){if(!date||!time||!/^[0-2]?\d:[0-5]\d$/.test(time))return null;let [y,m,d]=date.split('-').map(Number),[h,min]=time.split(':').map(Number),target=Date.UTC(y,m-1,d,h,min),guess=target;for(let i=0;i<3;i++){let parts=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:tz||'UTC',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(guess)).map(p=>[p.type,p.value]));let observed=Date.UTC(+parts.year,+parts.month-1,+parts.day,+parts.hour,+parts.minute);guess+=target-observed}return new Date(guess)}
function localOption(s,e){if(e.kind==='text_options')return '';let zone=Intl.DateTimeFormat().resolvedOptions().timeZone;if(s.date&&/^\d{2}:\d{2}$/.test(s.time||'')){let d=wallTimeToUTC(s.date,s.time,e.timezone);if(d)return new Intl.DateTimeFormat(undefined,{timeZone:zone,weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(d)+' · your time'}return [s.date?fmtDate(s.date):'',s.time,s.duration].filter(Boolean).join(' · ')||'Time to be announced'}
function utcToLocalInput(value,tz){if(!value)return '';let d=new Date(value);if(Number.isNaN(d.getTime()))return '';let p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:tz||'UTC',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d).map(x=>[x.type,x.value]));return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`}
function localInputToUTC(value,tz){if(!value)return '';let [date,time]=value.split('T');return wallTimeToUTC(date,time,tz)?.toISOString()||''}
function total(e){return (e.responses||[]).reduce((s,r)=>s+Number(r.seats||1),0)}
function eventUrl(e){return location.origin+location.pathname+'?event='+encodeURIComponent(e.id)}
function ownerHeaders(){return {'content-type':'application/json','x-owner-token':ownerToken}}
async function api(path,options={}){let res;try{res=await fetch(path,{...options,headers:{'content-type':'application/json',...(options.owner?{'x-owner-token':ownerToken}:{}),...(options.headers||{})}})}catch{throw new Error('Could not reach shared event storage. Check your connection and try again.')}let data={};try{data=await res.json()}catch{}if(!res.ok)throw new Error(data.error||'Something went wrong. Please try again.');return data}
function navTo(v,id){view=v;if(id)activeId=id;history.pushState({},'',location.pathname+(v==='poll'&&id?'?event='+encodeURIComponent(id):'#'+v+(id?'/'+id:'')));render();window.scrollTo(0,0)}
function readRoute(){let q=new URLSearchParams(location.search);if(q.has('event')){view='poll';activeId=q.get('event')}else if(q.has('view')){view=q.get('view');activeId=q.get('id')||activeId}else{let h=location.hash.slice(1).split('/');view=h[0]||'dashboard';activeId=h[1]||activeId}}
window.onpopstate=async()=>{readRoute();await loadForView();render()};readRoute();if(!profile&&view!=='poll')view='profile';
function toast(msg,error=false){let t=document.getElementById('toast');t.textContent=msg;t.classList.toggle('toast-error',error);t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2700)}
function header(){return `<header class="topbar"><div class="brand" onclick="go('dashboard')"><span class="brand-mark">g</span>gather<span class="brand-dot">.</span></div><div class="topright"><span class="demo-tag">PUBLIC PREVIEW</span><button class="avatar-owner" aria-label="Open profile" onclick="go('profile')">${esc(initials(profile?.name||'New user'))}</button></div></header>`}
function sidebar(){return `<aside class="sidebar"><div class="side-label">Workspace</div><button class="navbtn ${view==='dashboard'?'active':''}" onclick="go('dashboard')"><span class="ico">⌂</span>Overview</button><button class="navbtn ${view==='create'?'active':''}" onclick="createEvent()"><span class="ico">＋</span>New poll</button><div class="side-label" style="margin-top:26px">Your events <span style="float:right;margin-right:10px">${events.length}</span></div>${events.slice(0,5).map(e=>`<button class="navbtn" onclick="go('detail','${e.id}')"><span class="ico">◷</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.title)}</span></button>`).join('')}<button class="navbtn ${view==='profile'?'active':''}" onclick="go('profile')"><span class="ico">◉</span>Profile & settings</button><div class="side-foot"><strong>Polls that travel with your link.</strong><br>Events and responses are shared across devices.</div></aside>`}
function navMobile(){return `<nav class="mobile-nav"><button class="${view==='dashboard'?'active':''}" onclick="go('dashboard')"><b>⌂</b>Home</button><button class="${view==='create'?'active':''}" onclick="createEvent()"><b>＋</b>New poll</button><button class="${view==='detail'?'active':''}" onclick="go('detail','${activeId||events[0]?.id||''}')"><b>▤</b>Events</button><button class="${view==='profile'?'active':''}" onclick="go('profile')"><b>◉</b>Profile</button></nav>`}
function setupSelectionLimit(){let mode=document.getElementById('selectionMode'),input=document.getElementById('maxSelections'),fields=document.getElementById('selectionLimitFields'),editor=document.getElementById('sessionsEditor');if(!mode)return;let explicitlyChosen=!!Number(input.dataset.initial||0),chosen=Number(input.dataset.initial||0);function refresh(){let n=[...editor.querySelectorAll('.session-name')].filter(x=>x.value.trim()).length,maximum=Math.min(100,n);fields.hidden=mode.value!=='limited';input.disabled=maximum===0;input.innerHTML='';if(maximum===0){input.add(new Option('Add an option first',''));chosen=0}else{chosen=explicitlyChosen?Math.min(Math.max(1,chosen),maximum):maximum;for(let i=1;i<=maximum;i++)input.add(new Option(String(i),String(i)));input.value=String(chosen)}document.getElementById('limitHint').textContent=maximum?'Choose from 1 to '+maximum+' (the number of named options).':'Add an option before setting a limit.'}input.addEventListener('change',()=>{explicitlyChosen=true;chosen=Number(input.value)});mode.addEventListener('change',refresh);editor.addEventListener('input',refresh);document.getElementById('kind').addEventListener('change',()=>queueMicrotask(refresh));new MutationObserver(refresh).observe(editor,{childList:true});refresh()}
function setupImagePicker(){let input=document.getElementById('eventImage'),preview=document.getElementById('imagePreview'),key=document.getElementById('imageKey'),remove=document.getElementById('removeImage'),status=document.getElementById('imageStatus');if(!input)return;preparedPicture=null;pictureProcessing=null;let generation=0;input.addEventListener('change',()=>{let file=input.files[0];if(!file)return;let currentGeneration=++generation;preparedPicture=null;status.textContent='Preparing your picture…';pictureProcessing=new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{let scale=Math.min(1,1800/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>{URL.revokeObjectURL(url);if(!blob)return reject(new Error('This picture could not be prepared. Try a JPEG or PNG.'));resolve(blob)},'image/jpeg',0.85)}catch(err){URL.revokeObjectURL(url);reject(err)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('This picture cannot be opened by your browser. Try a JPEG or PNG.'))};img.src=url}).then(blob=>{if(generation!==currentGeneration)return;preparedPicture=blob;preview.src=URL.createObjectURL(blob);preview.hidden=false;status.textContent='Picture ready: '+file.name}).catch(err=>{if(generation!==currentGeneration)return;input.value='';preparedPicture=null;status.textContent=err.message;throw err});pictureProcessing.catch(()=>{})});remove.addEventListener('click',()=>{generation++;input.value='';key.value='';preparedPicture=null;pictureProcessing=null;preview.removeAttribute('src');preview.hidden=true;status.textContent='Picture removed.'})}
async function uploadPicture(file){let response;try{response=await fetch('/api/images',{method:'POST',headers:{'content-type':file.type,'x-owner-token':ownerToken},body:file})}catch{throw new Error('Could not upload the picture. Please try again.')}let result=await response.json();if(!response.ok)throw new Error(result.error||'Could not upload the picture');return result.key}
function createLinkFallback(){document.querySelectorAll('button').forEach(b=>{let label=b.textContent.replace(/\s+/g,' ').trim();if(/New poll|Create a poll/.test(label)){let a=document.createElement('a');a.className=b.className;a.href='?view=create';a.innerHTML=b.innerHTML;a.setAttribute('aria-label','Create a new poll');b.replaceWith(a)}})}
function shell(content){if(view==='poll'){document.getElementById('app').innerHTML=content;return}document.getElementById('app').innerHTML=header()+`<div class="layout">${sidebar()}<main class="main">${content}</main></div>${navMobile()}`;createLinkFallback();setupImagePicker();setupSelectionLimit();if(document.getElementById('kind')){document.getElementById('kind').addEventListener('change',updateTypeFields);updateTypeFields()}}
function dashboard(){let attended=events.reduce((n,e)=>n+total(e),0),open=events.filter(e=>e.status==='Open').length,visible=events.filter(e=>filter==='all'||e.status.toLowerCase()===filter);let cards=visible.map(e=>`<article class="event-card ${e.imageKey?'has-image':''}" ${e.imageKey?`style="background-image:linear-gradient(90deg,rgba(12,29,21,.84),rgba(12,29,21,.62)),url('/api/images/${encodeURIComponent(e.imageKey)}')"`:""} onclick="go('detail','${e.id}')"><div class="datebox"><div class="mon">${esc(month(e.date))}</div><div class="day">${esc(String(day(e.date)))}</div></div><div><div class="event-title">${esc(e.title)}</div><div class="event-meta">${esc(fmtDate(e.date))} · ${esc(e.location||'Location to be decided')}</div><div class="pills"><span class="pill ${e.status==='Closed'?'gray':''}">${esc(e.status)}</span><span class="pill gray">${e.kind==='signup_sheet'?'Sub-events':e.kind==='text_options'?'Text options':'Dates and times'}</span>${e.responses?.some(r=>r.comment)?'<span class="pill orange">Notes</span>':''}</div></div><div class="event-right"><div class="attending">${total(e)} <small>seats</small></div><div class="response-note">${e.responses?.length||0} responses</div></div></article>`).join('');shell(`<div class="page-head"><div><div class="kicker">Your workspace</div><h1>Event polls</h1><p class="subhead">A clear view of every gathering you’re organizing.</p></div><button class="btn primary" onclick="createEvent()">＋ Create poll</button></div><div class="stats"><div class="stat"><div class="stat-label">Total events</div><div class="stat-value">${events.length}</div><div class="stat-detail">Across your workspace</div></div><div class="stat"><div class="stat-label">Open polls</div><div class="stat-value">${open}</div><div class="stat-detail">Accepting responses</div></div><div class="stat"><div class="stat-label">Seats reserved</div><div class="stat-value">${attended}</div><div class="stat-detail">Across all events</div></div></div><div class="toolbar"><h2>All events</h2><div class="filters"><button class="filter ${filter==='all'?'active':''}" onclick="setFilter('all')">All</button><button class="filter ${filter==='open'?'active':''}" onclick="setFilter('open')">Open</button><button class="filter ${filter==='closed'?'active':''}" onclick="setFilter('closed')">Closed</button></div></div>${cards?`<div class="event-list">${cards}</div>`:`<div class="empty"><div class="empty-icon">◷</div><h3>${events.length?'No events in this view':'Create your first poll'}</h3><p>${events.length?'Try another filter.':'Your polls will be saved online and guests can answer from their own devices.'}</p><button class="btn primary" onclick="createEvent()">＋ Create a poll</button></div>`}`)}
function setFilter(f){filter=f;dashboard()}
function profileScreen(){let first=!profile;let tz=profile?.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Zurich';shell(`<div class="page-head"><div><div class="kicker">${first?'Welcome to Gather':'Your account'}</div><h1>${first?'Set up your profile':'Profile & settings'}</h1><p class="subhead">${first?'Tell organizers who you are. You can answer event polls without a profile.':'Manage the details used when you organize an event.'}</p></div></div>${first?'<div class="help-tip">This is a local demo profile. It helps personalize event creation on this device.</div>':''}<form class="profile-card" onsubmit="saveProfile(event)"><div class="profile-badge">${esc(initials(profile?.name||'You'))}</div><div class="profile-form"><div class="field-group"><label class="label" for="profileName">Your name</label><input class="input" id="profileName" name="name" required maxlength="80" placeholder="e.g. Tom Martin" value="${esc(profile?.name||'')}"></div><div class="field-group"><label class="label" for="profileEmail">Email <span style="font-weight:500;color:var(--muted)">· optional</span></label><input class="input" id="profileEmail" name="email" type="email" placeholder="you@example.com" value="${esc(profile?.email||'')}"><div class="hint">Used for account display only in this preview. Email invitations are not connected.</div></div><div class="field-group"><label class="label" for="profileTimezone">Default time zone</label><input class="input" id="profileTimezone" name="timezone" list="timezones" value="${esc(tz)}" placeholder="Europe/Zurich"><datalist id="timezones"><option value="Europe/Zurich"><option value="Europe/London"><option value="Europe/Paris"><option value="America/New_York"><option value="America/Los_Angeles"><option value="Asia/Tokyo"><option value="Australia/Sydney"></datalist><div class="hint">New polls use this time zone. Guests see the organizer’s selected zone.</div></div><div class="field-group full"><label class="setting"><input type="checkbox" name="profileReminders" ${profile?.reminders?'checked':''}><span><strong>Receive poll reminder summaries</strong><small>Reminder delivery is not connected in this preview.</small></span></label></div><button class="btn primary" type="submit">${first?'Save profile & continue':'Save profile'}</button></div></form>`)}
function saveProfile(ev){ev.preventDefault();let f=new FormData(ev.target),timezone=String(f.get('timezone')||'').trim()||'Europe/Zurich';try{new Intl.DateTimeFormat('en',{timeZone:timezone}).format()}catch{toast('Enter a valid time zone such as Europe/Zurich',true);return}saveProfileData({name:String(f.get('name')).trim(),email:String(f.get('email')||'').trim(),timezone,reminders:f.has('profileReminders')});view='dashboard';history.pushState({},'',location.pathname+'#dashboard');loadOwnerEvents().then(render).catch(err=>{events=[];render();toast(err.message,true)})}
function sessionEditorRow(s,i){let durations=['15 min','30 min','45 min','1 hour','90 min','2 hours','3 hours','Half day','All day'];let selected=s.duration||'1 hour';return `<div class="option-card" data-id="${esc(s.id||crypto.randomUUID())}"><div class="option-fields"><div class="option-field option-title-field"><label>Option label</label><input class="input session-name" aria-label="Option ${i+1} name" placeholder="e.g. Project catch-up" value="${esc(s.name||'')}"></div><div class="option-field"><label>Date</label><input class="input session-date" aria-label="Option ${i+1} date" type="date" value="${esc(s.date||'')}"></div><div class="option-field"><label>Start time</label><input class="input session-time" aria-label="Option ${i+1} start time" type="time" value="${esc(s.time||'')}"></div><div class="option-field"><label>Duration</label><select class="input session-duration" aria-label="Option ${i+1} duration">${durations.map(d=>`<option ${selected===d?'selected':''}>${d}</option>`).join('')}</select></div><div class="option-field"><label>Seats (0 = no limit)</label><input class="input session-capacity" aria-label="Option ${i+1} seat limit" type="number" min="0" max="99999" value="${Number(s.capacity||0)}"></div></div><button type="button" class="remove-row option-remove" aria-label="Remove option" onclick="this.parentElement.remove()">×</button></div>`}
function formScreen(){let e=formMode==='edit'?current():null,rows=e?.sessions?.length?e.sessions:[{name:'First time option',date:e?.date||'',time:'12:00',duration:'1 hour',capacity:0}],settings=e||{};let defaultTz=e?.timezone||profile?.timezone||'Europe/Zurich';shell(`<button class="backlink" onclick="${e?`go('detail','${e.id}')`:'go(\'dashboard\')'}">← Back to events</button><div class="page-head" style="margin-top:9px"><div><div class="kicker">${e?'Edit event':'New event'}</div><h1>${e?'Update your poll':'Create a poll'}</h1><p class="subhead">Add possible dates and times, then share the event-specific link.</p></div></div><form class="form-wrap" id="eventForm" onsubmit="saveEvent(event)"><div class="form-grid"><div class="field-group full"><label class="label" for="eventImage">Event card picture <span style="font-weight:500;color:var(--muted)">· optional</span></label><div class="image-actions"><label for="eventImage" class="btn primary" style="cursor:pointer">Choose a picture</label><input type="file" id="eventImage" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden"><button type="button" class="btn small" id="removeImage">Remove picture</button></div><div class="hint" id="imageStatus" role="status" aria-live="polite">Choose a photo from your device.</div><img id="imagePreview" class="image-preview" alt="Event card picture preview" ${e?.imageKey?`src="/api/images/${encodeURIComponent(e.imageKey)}"`:'hidden'}><input type="hidden" id="imageKey" value="${esc(e?.imageKey||'')}"></div><div class="field-group full"><label class="label" for="title">Event name</label><input class="input" id="title" name="title" required maxlength="90" placeholder="e.g. Team summer picnic" value="${esc(e?.title||'')}"></div><div class="field-group full"><label class="label" for="kind">Choose a poll type</label><select class="input" id="kind" name="kind"><option value="group_poll" ${(e?.kind||'group_poll')==='group_poll'?'selected':''}>Multiple dates and times</option><option value="signup_sheet" ${e?.kind==='signup_sheet'?'selected':''}>Multiple sub-events in one day</option><option value="text_options" ${e?.kind==='text_options'?'selected':''}>List of text options</option></select></div><div class="field-group"><label class="label" for="location">Location</label><input class="input" id="location" name="location" placeholder="Address or meeting link" value="${esc(e?.location||'')}"></div><div class="field-group full"><label class="label" for="description">Event details</label><textarea class="textarea" name="description" id="description" maxlength="500" placeholder="A short welcome or useful details">${esc(e?.description||'')}</textarea></div><div class="field-group full"><div class="label"><span>Possible dates & times</span><span style="color:var(--muted);font-weight:500">Different durations are supported</span></div><div id="dayPicker" hidden><label class="label" for="eventDay">Event day</label><input class="input" id="eventDay" type="date" value="${esc(e?.date||'')}"><div class="hint">All sub-events take place on this day.</div></div><div id="sessionsEditor" class="sessions-editor">${rows.map((s,i)=>sessionEditorRow(s,i)).join('')}</div><button type="button" class="btn small" style="margin-top:9px" onclick="addSessionRow()">＋ Add a time option</button><div class="hint">Guests can select every time that works for them. Seat limits apply to each option.</div></div><div class="field-group full"><label class="label" for="selectionMode">Number of answers per person</label><select class="input" id="selectionMode"><option value="unlimited" ${!e?.maxSelections?'selected':''}>Multiple choice — no limit</option><option value="limited" ${e?.maxSelections?'selected':''}>Limit the number of choices</option></select><div id="selectionLimitFields" ${e?.maxSelections?'':'hidden'}><label class="label" for="maxSelections" style="margin-top:10px">Maximum choices</label><select id="maxSelections" class="input" data-initial="${ e.id}')">Delete event</button>`:''}<button type="button" class="btn" onclick="${e?`go('detail','${e.id}')`:'go(\'dashboard\')'}">Cancel</button></div><button class="btn primary" type="submit">${e?'Save changes':'Create event'} →</button></div></form>`)}
function updateTypeFields(){let kind=document.getElementById('kind')?.value;if(!kind)return;let day=document.getElementById('dayPicker');day.hidden=kind!=='signup_sheet';let editor=document.getElementById('sessionsEditor');for(let row of editor.children){let fields=row.querySelectorAll('.option-field');fields[1].hidden=kind!=='group_poll';fields[2].hidden=kind==='text_options';fields[3].hidden=kind==='text_options';let name=row.querySelector('.session-name');name.placeholder=kind==='text_options'?'e.g. Pizza':kind==='signup_sheet'?'e.g. Workshop':'e.g. Morning';if(formMode==='create'&&name.value==='First time option'&&kind!=='group_poll')name.value='';}let heading=editor.previousElementSibling.previousElementSibling;if(heading?.classList.contains('label')){heading.firstElementChild.textContent=kind==='text_options'?'Text choices':kind==='signup_sheet'?'Sub-events':'Possible dates & times';heading.lastElementChild.textContent=kind==='text_options'?'Add the choices guests can select':'Different durations are supported'}let add=editor.nextElementSibling;if(add){add.textContent=kind==='text_options'?'＋ Add an option':kind==='signup_sheet'?'＋ Add a sub-event':'＋ Add a time option';add.nextElementSibling.textContent=kind==='text_options'?'Guests can select all choices that apply.':kind==='signup_sheet'?'Guests can select the sub-events they want to attend.':'Guests can select every time that works for them. Seat limits apply to each option.'}}
function addSessionRow(){let c=document.getElementById('sessionsEditor'),n=c.children.length,d=document.createElement('div');d.innerHTML=sessionEditorRow({name:'',date:'',time:'',duration:'1 hour',capacity:0},n);c.append(d.firstElementChild);updateTypeFields()}
async function saveEvent(ev){ev.preventDefault();if(savingEvent)return;let f=new FormData(ev.target),sessionRows=[...document.querySelectorAll('.option-card')].map(r=>({id:r.dataset.id||crypto.randomUUID(),name:r.querySelector('.session-name').value.trim(),date:r.querySelector('.session-date').value,time:r.querySelector('.session-time').value.trim(),duration:r.querySelector('.session-duration').value,capacity:Number(r.querySelector('.session-capacity').value||0)})).filter(s=>s.name);if(!sessionRows.length){toast('Add at least one time option',true);return}let title=String(f.get('title')).trim(),owner=String(f.get('owner')||'').trim();if(!title){toast('Enter an event name',true);return}if(!owner){toast('Enter the organizer name',true);return}let kind=String(f.get('kind')),eventDay=document.getElementById('eventDay')?.value||'';if(kind==='signup_sheet'&&!eventDay){toast('Choose the day for your sub-events',true);document.getElementById('eventDay').focus();return}if(kind==='signup_sheet')sessionRows.forEach(s=>s.date=eventDay);if(kind==='text_options')sessionRows.forEach(s=>{s.date='';s.time='';s.duration=''});let maxSelections=document.getElementById('selectionMode').value==='limited'?Number(document.getElementById('maxSelections').value):0;if(!Number.isInteger(maxSelections)||maxSelections<0||maxSelections>sessionRows.length||(document.getElementById('selectionMode').value==='limited'&&maxSelections<1)){toast('Choose a limit between 1 and the number of options',true);return}let firstDate=sessionRows.find(s=>s.date)?.date||'',timezone=String(f.get('timezone')||'').trim()||profile?.timezone||'Europe/Zurich';try{new Intl.DateTimeFormat('en',{timeZone:timezone}).format()}catch{toast('Enter a valid time zone such as Europe/Zurich',true);return}let payload={id:formMode==='edit'?current().id:crypto.randomUUID(),title,date:firstDate,location:String(f.get('location')||'').trim(),description:String(f.get('description')||'').trim(),owner,kind:f.get('kind'),timezone,deadline:localInputToUTC(f.get('deadline'),timezone),reminders:f.has('reminders'),hideParticipants:f.has('hideParticipants'),meetingLink:String(f.get('meetingLink')||'').trim(),maxSelections,sessions:sessionRows};let submit=ev.target.querySelector('[type="submit"]');savingEvent=true;if(submit){submit.disabled=true;submit.textContent='Saving…'}try{if(pictureProcessing)await pictureProcessing;payload.imageKey=preparedPicture?await uploadPicture(preparedPicture):document.getElementById('imageKey').value;let saved=formMode==='edit'?await api('/api/events/'+encodeURIComponent(payload.id),{method:'PUT',body:JSON.stringify(payload),owner:true}):await api('/api/events',{method:'POST',body:JSON.stringify(payload),owner:true});activeId=saved.id;events=[saved,...events.filter(x=>x.id!==saved.id)];toast(formMode==='edit'?'Event updated':'Poll created');go('detail',saved.id);loadOwnerEvents().then(()=>{if(view==='detail'&&activeId===saved.id)render()}).catch(()=>{})}catch(err){toast(err.message,true);if(submit){submit.disabled=false;submit.textContent=formMode==='edit'?'Save changes':'Create event'}}finally{savingEvent=false}}
function detail(){let e=current();if(!e){dashboard();return}let options=e.sessions.map(s=>`<div class="slotline"><span class="slotdot"></span><div class="slotname">${esc(s.name)} <span style="font-weight:500;color:var(--muted)">· ${esc([s.date?fmtDate(s.date):'',s.time,s.duration].filter(Boolean).join(' · ')||(e.kind==='text_options'?'':'Time TBD'))}</span></div><div class="slotcount">${e.responses.filter(r=>r.selected.includes(s.id)).reduce((n,r)=>n+Number(r.seats),0)} / ${s.capacity||'∞'} seats</div></div>`).join('');let people=e.responses.map(r=>`<div class="participant"><div class="initial">${esc(initials(r.name))}</div><div><div class="person-name">${esc(r.name)}</div><div class="person-sub">${r.seats} seat${r.seats===1?'':'s'} · ${esc(r.selected.map(id=>e.sessions.find(s=>s.id===id)?.name).filter(Boolean).join(', ')||'No option selected')}</div>${r.comment?`<div class="comment">${esc(r.comment)}</div>`:''}</div><button class="close" title="Remove response" onclick="removeResponse('${e.id}','${r.id}')">×</button></div>`).join('');let booked=e.sessions.find(s=>s.id===e.bookedSessionId);let chooseOptions=e.sessions.map(s=>`<option value="${esc(s.id)}" ${e.bookedSessionId===s.id?'selected':''}>${esc(s.name)} · ${esc(s.date?fmtDate(s.date):'Date TBD')} ${esc(s.time||'')}</option>`).join('');shell(`<button class="backlink" onclick="go('dashboard')">← All events</button><section class="detail-hero${e.imageKey?' has-photo':''}" ${e.imageKey?`style="background-image:linear-gradient(90deg,rgba(8,37,28,.82),rgba(8,37,28,.55)),url('/api/images/${encodeURIComponent(e.imageKey)}');background-size:cover;background-position:center"`:""}><div class="kicker" style="color:#d7e9dd">EVENT OVERVIEW</div><h1>${esc(e.title)}</h1><p>${esc(e.description||'Event details and participant responses.')}</p><div class="detail-line"><span>◷ &nbsp;${esc(fmtDate(e.date))}</span><span>⌖ &nbsp;${esc(e.location||'Location TBD')}</span><span>Hosted by ${esc(e.owner)}</span></div></section><div class="detail-actions"><button class="btn primary" onclick="shareEvent('${e.id}')">↗ Share participant link</button><button class="btn" onclick="editEvent('${e.id}')">✎ Edit event</button><button class="btn" onclick="go('poll','${e.id}')">◉ Preview poll</button><button class="btn" onclick="toggleStatus('${e.id}')">${e.status==='Open'?'Close poll':'Reopen poll'}</button></div>${booked?`<div class="help-tip">Confirmed time: ${esc(booked.name)} · ${esc(booked.date?fmtDate(booked.date):'')} ${esc(booked.time||'')}. Guests can download a calendar file.</div>`:''}<section class="panel"><div class="panel-head"><h2>${e.kind==='signup_sheet'?'Sub-event sign-ups':e.kind==='text_options'?'Responses by option':'Availability by time option'}</h2><span>${e.responses.length} responses · ${total(e)} seats reserved</span></div><div class="slot-list">${options}</div>${e.kind==='group_poll'?`<div class="booking-tool"><select class="input" id="finalSlot">${chooseOptions}</select><button class="btn primary" onclick="bookTime('${e.id}')">Confirm final time</button></div><div class="hint">Choose the option that works best to close the poll and publish the confirmed time.</div>`:''}</section><section class="panel"><div class="panel-head"><h2>Poll settings</h2><span>${esc(e.timezone||'Europe/Zurich')}</span></div><div class="detail-line" style="color:var(--muted)"><span>${e.deadline?'Deadline: '+esc(new Date(e.deadline).toLocaleString()):'No deadline'}</span><span>${e.reminders?'Reminders enabled':'Reminders off'}</span><span>${e.hideParticipants?'Guest list hidden':'Guest list visible'}</span>${e.meetingLink?`<a href="${esc(e.meetingLink)}" target="_blank" rel="noreferrer">Video meeting link</a>`:''}</div></section><section class="panel"><div class="panel-head"><h2>People and private notes</h2><span>Notes visible to you only</span></div>${people||'<div class="participant-preview">No responses yet. Share the poll link to invite guests.</div>'}</section><p class="participant-preview">Guest view shows participant names and votes unless guest-list privacy is enabled. Organizer notes are hidden.</p>`)}
function deadlinePassed(e){return !!e.deadline&&new Date(e.deadline).getTime()<Date.now()}
async function poll(){let e=current();if(!e){shell(`<div class="empty"><div class="empty-icon">?</div><h3>This event link isn’t available</h3><p>The event may have been removed or the link is incorrect.</p></div>`);return}let isClosed=e.status==='Closed'||deadlinePassed(e),opts=e.sessions.map(s=>{let chosen=e.responses.filter(r=>r.selected.includes(s.id)).reduce((n,r)=>n+Number(r.seats),0),pct=s.capacity?Math.min(100,chosen/s.capacity*100):20;return `<div class="poll-option ${isClosed?'disabled':''}" data-session="${esc(s.id)}" onclick="toggleOption(this)"><div class="checkbox"></div><div class="option-copy"><div class="option-title">${esc(s.name)}</div><div class="option-sub">${esc(localOption(s,e))}</div><div class="availability"><i style="width:${pct}%"></i></div></div><div class="spots">${s.capacity?Math.max(0,s.capacity-chosen)+' seats left':'Open'}</div></div>`}).join('');let booked=e.sessions.find(s=>s.id===e.bookedSessionId);let names=e.responses.map(r=>r.name.split(' ')[0]);let action=booked?`<div class="help-tip">The organizer confirmed ${esc(booked.name)} · ${esc(booked.date?fmtDate(booked.date):'')} ${esc(booked.time||'')}.</div><button class="btn primary" style="width:100%" onclick="downloadCalendar('${e.id}')">↓ Add to calendar</button>`:'';shell(`<div class="poll-shell"><div class="poll-brand"><div class="brand" onclick="go('dashboard')"><span class="brand-mark">g</span>gather<span class="brand-dot">.</span></div><span class="demo-tag">EVENT POLL</span></div><section class="poll-hero${e.imageKey?' has-photo':''}" ${e.imageKey?`style="background-image:linear-gradient(90deg,rgba(8,37,28,.82),rgba(8,37,28,.55)),url('/api/images/${encodeURIComponent(e.imageKey)}');background-size:cover;background-position:center"`:""}><div class="eyebrow">You’re invited</div><h1>${esc(e.title)}</h1><p>${esc(e.description||'Choose the times that work for you.')}</p></section><div class="poll-meta"><span>◷ &nbsp;${esc(e.timezone||'Europe/Zurich')}</span><span>⌖ &nbsp;${esc(e.location||'Location to be decided')}</span>${e.deadline?`<span>Respond by ${esc(new Date(e.deadline).toLocaleDateString())}</span>`:''}${e.meetingLink?`<span><a href="${esc(e.meetingLink)}" target="_blank" rel="noreferrer">Video meeting</a></span>`:''}</div>${isClosed?`<div class="help-tip">${deadlinePassed(e)?'The response deadline has passed.':'This poll is closed.'} ${booked?'The organizer selected a final time below.':''}</div>`:''}${action}<section class="poll-section" style="margin-top:18px"><div class="section-top"><h2>${e.kind==='signup_sheet'?'Choose sub-events':e.kind==='text_options'?'Choose your options':'Which times work for you?'}</h2><span>${e.maxSelections?`Choose up to ${e.maxSelections}`:'Select all that apply'}</span></div>${opts}</section><form class="rsvp-card" onsubmit="sendRsvp(event,'${e.id}')"><h2>${e.kind==='signup_sheet'?'Save your place':e.kind==='text_options'?'Add your response':'Add your availability'}</h2><p>No account needed. Let ${esc(e.owner)} know who’s coming.</p><div class="field-group"><label class="label" for="guestName">Your name</label><input class="input" id="guestName" name="name" required maxlength="80" placeholder="e.g. Alex Martin" autocomplete="name"></div><div class="field-group"><label class="label">Seats to reserve</label><div class="quantity"><span>Including you</span><div class="stepper"><button type="button" onclick="changeSeats(-1)" aria-label="Remove a seat">−</button><span id="seatCount">1</span><button type="button" onclick="changeSeats(1)" aria-label="Add a seat">+</button></div></div></div><div class="field-group"><label class="label" for="guestNote">Note for ${esc(e.owner)} <span style="font-weight:500;color:var(--muted)">· optional</span></label><textarea class="textarea" id="guestNote" name="comment" rows="3" maxlength="300" placeholder="Anything the organizer should know?"></textarea><div class="private-note">Only the poll owner can see your note.</div></div><button class="submit" type="submit" ${isClosed?'disabled style="opacity:.5;cursor:not-allowed"':''}>${isClosed?'Responses closed':'Submit my response  →'}</button><div class="private-note" style="text-align:center;margin-top:9px">Your name and seats are visible to event guests.</div></form>${e.hideParticipants?'':`<section class="roster"><div class="roster-head"><h3>Coming along</h3><span>${total(e)} people</span></div><div class="roster-list">${e.responses.slice(0,3).map(r=>`<span class="mini-avatar">${esc(initials(r.name))}</span>`).join('')}${e.responses.length>3?`<span class="mini-avatar" style="background:#eee">+${e.responses.length-3}</span>`:''}<span class="roster-names">${names.slice(0,3).map(esc).join(', ')}${names.length>3?' & more':''}</span></div></section>`}<div class="poll-footer">Gather · Event-specific RSVP</div></div>`)}
function changeSeats(n){seats=Math.max(1,Math.min(99,seats+n));let el=document.getElementById('seatCount');if(el)el.textContent=seats}
function toggleOption(el){if(el.classList.contains('disabled'))return;let limit=Number(current()?.maxSelections||0),count=document.querySelectorAll('.poll-option.selected').length;if(!el.classList.contains('selected')&&limit&&count>=limit){toast('Choose up to '+limit+' option'+(limit===1?'':'s'),true);return}el.classList.toggle('selected');el.querySelector('.checkbox').textContent=el.classList.contains('selected')?'✓':''}
async function sendRsvp(ev,id){ev.preventDefault();let selected=[...document.querySelectorAll('.poll-option.selected')].map(x=>x.dataset.session);if(!selected.length){toast('Choose at least one time option',true);return}let data=new FormData(ev.target),name=String(data.get('name')).trim();if(!name){toast('Enter your name to continue',true);return}try{await api('/api/events/'+encodeURIComponent(id),{method:'POST',body:JSON.stringify({name,seats,selected,comment:String(data.get('comment')||'').trim()})});seats=1;toast('Thanks, '+name+' — your response is saved');setTimeout(async()=>{await loadPublicEvent(id);render()},300)}catch(err){toast(err.message,true)}}
async function loadOwnerEvents(){events=await api('/api/events',{method:'GET',owner:true})}
async function loadPublicEvent(id){try{let event=await api('/api/events/'+encodeURIComponent(id),{method:'GET'});events=[event];activeId=event.id}catch(err){events=[];activeId=id;toast(err.message,true)}}
async function loadForView(){if(view==='poll')await loadPublicEvent(activeId);else if(profile)try{await loadOwnerEvents()}catch(err){events=[];toast(err.message,true)}}
function go(v,id){if(v==='dashboard'&&!profile){navTo('profile');return}navTo(v,id);if(v==='poll')loadPublicEvent(id).then(render);else if(v==='dashboard'||v==='detail')loadOwnerEvents().then(render).catch(err=>toast(err.message,true))}
function createEvent(){if(!profile){navTo('profile');return}formMode='create';activeId=null;navTo('create')}
function editEvent(id){formMode='edit';activeId=id;navTo('edit',id)}
async function bookTime(id){let e=current(),sid=document.getElementById('finalSlot')?.value;if(!sid){toast('Choose a time option',true);return}try{let updated=await api('/api/events/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status:'Closed',bookedSessionId:sid}),owner:true});events=events.map(x=>x.id===id?updated:x);detail();toast('Final time confirmed')}catch(err){toast(err.message,true)}}
function shareEvent(id){let e=events.find(x=>x.id===id);if(!e)return;let u=eventUrl(e);if(navigator.share)navigator.share({title:e.title,text:'You’re invited! Respond to this event poll.',url:u}).catch(()=>{});else navigator.clipboard?.writeText(u).then(()=>toast('Participant link copied')).catch(()=>prompt('Copy event link',u));}
async function toggleStatus(id){let e=current(),status=e.status==='Open'?'Closed':'Open';try{let updated=await api('/api/events/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status,bookedSessionId:status==='Open'?null:e.bookedSessionId}),owner:true});events=events.map(x=>x.id===id?updated:x);detail();toast(status==='Open'?'Poll reopened':'Poll closed')}catch(err){toast(err.message,true)}}
async function deleteEvent(id){let e=current();if(!confirm(`Delete “${e.title}” and its responses?`))return;try{await api('/api/events/'+encodeURIComponent(id),{method:'DELETE',owner:true});await loadOwnerEvents();activeId=null;go('dashboard');toast('Event deleted')}catch(err){toast(err.message,true)}}
async function removeResponse(eid,rid){try{await api('/api/events/'+encodeURIComponent(eid)+'/responses/'+encodeURIComponent(rid),{method:'DELETE',owner:true});await loadOwnerEvents();detail();toast('Response removed')}catch(err){toast(err.message,true)}}
function downloadCalendar(id){let e=current(),s=e?.sessions.find(x=>x.id===e.bookedSessionId);if(!s)return toast('No final time has been chosen yet',true);let start=wallTimeToUTC(s.date||e.date,s.time||'12:00',e.timezone);if(!start)return toast('Add a date and start time to the confirmed option first',true);let mins=60,dur=String(s.duration||'1 hour');if(dur==='15 min')mins=15;else if(dur==='30 min')mins=30;else if(dur==='45 min')mins=45;else if(dur==='90 min')mins=90;else if(dur==='2 hours')mins=120;else if(dur==='3 hours')mins=180;else if(dur==='Half day')mins=240;else if(dur==='All day')mins=1440;let end=new Date(start.getTime()+mins*60000),stamp=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');let ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Gather//Event Poll//EN','BEGIN:VEVENT','UID:'+e.id+'@gather','DTSTAMP:'+stamp(new Date()),'DTSTART:'+stamp(start),'DTEND:'+stamp(end),'SUMMARY:'+e.title.replace(/[\\,;]/g,' '),'LOCATION:'+(e.location||'').replace(/[\\,;]/g,' '),'DESCRIPTION:'+(e.description||'').replace(/[\\,;]/g,' '),'END:VEVENT','END:VCALENDAR'].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download=(e.title||'event').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.ics';a.click();URL.revokeObjectURL(a.href)}
function render(){if(view==='poll')poll();else if(view==='create'||view==='edit')formScreen();else if(view==='detail')detail();else if(view==='profile')profileScreen();else dashboard()}
async function boot(){if(view==='poll')await loadPublicEvent(activeId);else if(!profile){view='profile'}else{try{await loadOwnerEvents()}catch(err){events=[];toast(err.message,true)}}render()}
window.go=go;window.createEvent=createEvent;window.editEvent=editEvent;window.setFilter=setFilter;window.saveEvent=saveEvent;window.addSessionRow=addSessionRow;window.deleteEvent=deleteEvent;window.shareEvent=shareEvent;window.toggleStatus=toggleStatus;window.removeResponse=removeResponse;window.changeSeats=changeSeats;window.toggleOption=toggleOption;window.sendRsvp=sendRsvp;window.bookTime=bookTime;window.downloadCalendar=downloadCalendar;window.saveProfile=saveProfile;boot();
})();

</script></body></html>
